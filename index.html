

<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://covers.openlibrary.org">
<title>La Diffusa — la biblioteca diffusa / die verteilte Bibliothek</title>
<style>
  :root{
    --paper:#faf6ef; --card:#fffdf8; --ink:#2f2a24; --mut:#8a8070; --line:#e8e0d0;
    --green:#3a6b4f; --greendk:#2c5239; --greenbg:#eef4ec; --greenline:#cdddcd;
    --terra:#c4664a; --terrabg:#faf0e8; --terraline:#ecd5c5;
    --gold:#b98a2f;
    --radius:.85rem;
    --shadow:0 1px 3px rgba(60,50,30,.06),0 4px 14px rgba(60,50,30,.07);
    --font-head:"Iowan Old Style",Georgia,"Times New Roman",serif;
    color-scheme:light;
  }
  :root.dark{
    --paper:#211d17; --card:#2a251d; --ink:#ece5d8; --mut:#a19681; --line:#3d362a;
    --green:#8fc4a5; --greendk:#a9d5bb; --greenbg:#24312a; --greenline:#3a5245;
    --terra:#e0937a; --terrabg:#32261f; --terraline:#4d3a2e;
    --gold:#d4b25e;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  :root.dark .pill.kiez{background:#232a36;color:#9db4d8;border-color:#36415a}
  :root.dark .chip.on{background:var(--terra);color:#211d17}
  .chip.teen.on{background:var(--gold);border-color:var(--gold);color:#fff}
  :root.dark .chip.kids.on{background:var(--green);color:#211d17}
  :root.dark .chip.teen.on{background:var(--gold);color:#211d17}
  :root.dark .vbtn.on{background:var(--ink);color:var(--paper)}
  :root.dark .gcover .badge{background:rgba(33,29,23,.85);color:var(--ink)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;padding:0 0 4rem;max-width:46rem;margin:0 auto;overflow-x:clip}
  /* ---------- hero ---------- */
  .hero{
    background:
      radial-gradient(circle at 85% -10%, var(--terrabg) 0%, transparent 55%),
      radial-gradient(circle at -10% 110%, var(--greenbg) 0%, transparent 50%),
      var(--paper);
    border-bottom:1px solid var(--line);
    padding:1.3rem .9rem 1.1rem;margin-bottom:1rem;
  }
  .toprow{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;max-width:46rem;margin:0 auto}
  .logo{font-family:var(--font-head);font-size:1.5rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:.45rem}
  .logo .bk{color:var(--green);font-style:italic}
  .logo .mark{font-size:1.3rem}
  .langSel{font-size:.85rem;border:1px solid var(--line);border-radius:.45rem;padding:.3rem .4rem;background:var(--card);color:var(--ink);margin-left:auto;height:1.85rem}
  .langSel:focus{font-size:1rem} /* iOS: no auto-zoom al focus (16px al momento del tap) */
  .themeBtn{border:1px solid var(--line);border-radius:.45rem;padding:.3rem .45rem;background:var(--card);cursor:pointer;font-size:.85rem;line-height:1.2;height:1.85rem}
  .tagline{font-family:var(--font-head);font-style:italic;font-size:.85rem;color:var(--mut);margin-top:.35rem;max-width:46rem;margin-left:auto;margin-right:auto}
  .main{padding:0 .9rem;max-width:46rem;margin:0 auto}
  /* ---------- action buttons ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
  .abtn{display:flex;flex-direction:column;align-items:center;gap:.1rem;text-align:center;text-decoration:none;border-radius:var(--radius);padding:.85rem .5rem .7rem;font-size:1rem;font-weight:700;font-family:var(--font-head);border:1.5px solid transparent;transition:transform .12s,box-shadow .12s;box-shadow:var(--shadow)}
  .abtn:active{transform:scale(.97)}
  .abtn .big{font-size:1.5rem}
  .abtn .sub{font-size:.7rem;font-weight:400;color:var(--mut);font-family:system-ui,sans-serif}
  .abtn.offer{background:var(--greenbg);border-color:var(--greenline);color:var(--greendk)}
  .abtn.wishb{background:var(--terrabg);border-color:var(--terraline);color:var(--terra)}
  /* ---------- how ---------- */
  details.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
  details.how summary{cursor:pointer;font-size:.95rem;font-weight:600;font-family:var(--font-head);list-style:none;color:var(--greendk)}
  details.how summary::-webkit-details-marker{display:none}
  details.how summary::before{content:"ℹ️ "}
  details.how[open] summary{margin-bottom:.35rem}
  .how ol{padding-left:1.2rem;font-size:.85rem}
  .how ol li{margin-bottom:.25rem}
  .how ol li::marker{color:var(--terra);font-weight:700}
  .how .note{font-size:.75rem;color:var(--mut);margin-top:.5rem}
  /* ---------- controls ---------- */
  .controls{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .8rem;margin-bottom:.7rem;position:sticky;top:.5rem;z-index:5;box-shadow:var(--shadow)}
  .ctlgrid{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
  .ctl{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:.4rem}
  .ctl label{font-size:.72rem;color:var(--mut);white-space:nowrap}
  select.ctl{border:1px solid var(--line);border-radius:.55rem;padding:.4rem .5rem;font-size:.85rem;background:var(--paper);color:var(--ink);flex:1}
  select.ctl:focus{font-size:1rem} /* iOS: no auto-zoom al focus */
  .vswitch .vsort{border:none;background:transparent;padding:.25rem .5rem;font-size:.78rem;color:var(--mut);border-left:1px solid var(--line);max-width:7.5rem;cursor:pointer;position:relative;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
  .vswitch .vsort:active{background:var(--greenbg);color:var(--greendk)}
  .vswitch{position:relative;overflow:visible}
  .sortpop{display:none;background:var(--card);border:1px solid var(--mut);border-radius:.6rem;box-shadow:0 6px 24px rgba(0,0,0,.22);min-width:11rem;padding:.3rem;text-align:left}
  .sortpop.open{display:block}
  .sortpop button{display:block;width:100%;border:none;background:transparent;text-align:left;font-size:.85rem;padding:.45rem .6rem;border-radius:.45rem;cursor:pointer;color:var(--ink);font-family:system-ui,sans-serif}
  .sortpop button.on{background:var(--greenbg);color:var(--greendk);font-weight:600}
  .agechips{display:flex;gap:.35rem;flex:0 1 auto;flex-wrap:wrap;justify-content:flex-start}
  .ageGroup{flex:1 1 100%;flex-wrap:wrap;border:1px solid var(--line);border-radius:.7rem;padding:.22rem .3rem;background:var(--paper);box-shadow:0 1px 2px rgba(60,50,30,.05)} /* gruppo ETÀ: pillole + sottofasce dentro UNA sola scatola, mai sparse */
  #ageRow{gap:.25rem}
  #ageRow .chip{font-size:.74rem;padding:.26rem .5rem} /* compatte: Tutte le età+Adulti+Ragazzi in UNA riga, Bambini(+fasce) sotto → si guadagna una riga */
  #typeRow{flex:1 1 100%;display:flex;border:1px solid var(--line);border-radius:.6rem;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(60,50,30,.06)} /* segmented control Tutto/Offerte/Desideri: pezzo unico, famiglia "selettori" */
  #typeRow .chip{flex:1 1 0;border:none;border-radius:0;background:transparent;box-shadow:none;font-size:.78rem;padding:.42rem .25rem;text-align:center;color:var(--ink)}
  #typeRow .chip+.chip{border-left:1px solid var(--line)}
  #typeRow .chip:hover{border-color:transparent;background:var(--greenbg)}
  #typeRow .chip.on{background:var(--ink);color:var(--paper)}
  #typeRow .chip.offer.on{background:var(--green);color:#fff}
  #typeRow .chip.wish.on{background:var(--terra);color:#fff}
  :root.dark #typeRow{background:var(--card)}
  :root.dark #typeRow .chip{color:var(--ink)}
  :root.dark #typeRow .chip.on{background:var(--ink);color:var(--paper)}
  :root.dark #typeRow .chip.offer.on{background:var(--green);color:#211d17}
  :root.dark #typeRow .chip.wish.on{background:var(--terra);color:#211d17}
  .agechips.sub{display:none;gap:.15rem;align-items:center} /* fasce: niente box verde annidato, solo mini-pillole dentro la scatola età */
  .agechips.sub::before{content:"";width:1px;height:1.4rem;background:var(--greenline);margin-right:.2rem} /* sottile divisore dopo Bambini */
  .agechips.sub.show{display:inline-flex} /* fluisce inline dopo le chip età, nessuna riga dedicata */
  .kidwrap{display:inline-flex;align-items:center;gap:.2rem;flex-wrap:wrap;max-width:100%} /* Bambini + fasce: preferibilmente uniti; se non entrano proprio, vanno a capo DENTRO la scatola, mai fuori */
  #ageRow2 .chip,.agechips.sub .chip{font-size:.62rem;padding:.1rem .35rem}
  .chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:.78rem;padding:.28rem .7rem;cursor:pointer;transition:all .12s}
  .chip:hover{border-color:var(--terra)}
  .chip.on{background:var(--terra);color:#fff;border-color:var(--terra)}
  .chip.kids.on{background:var(--green);border-color:var(--green);color:#fff}
  .qwrap{position:relative;margin-top:.55rem}
  .qwrap input{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:.45rem 1rem .45rem 2.1rem;font-size:1rem;color:var(--ink);outline:none;transition:border-color .12s}
  .qwrap::before{content:"🔍";position:absolute;left:.65rem;top:50%;transform:translateY(-50%);font-size:.8rem;opacity:.6}
  .qwrap input:focus{border-color:var(--terra);background:var(--card)}
  /* ---------- view bar ---------- */
  .viewbar{display:flex;justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.1rem .1rem .5rem}
  #count{font-size:.78rem;color:var(--mut);font-style:italic;font-family:var(--font-head);white-space:nowrap;flex:0 0 auto}
  .vswitch{display:flex;border:1px solid var(--line);border-radius:.55rem;overflow:visible;background:var(--card)}
  .vbtn{border:none;background:transparent;padding:.25rem .7rem;font-size:.78rem;cursor:pointer;color:var(--mut)}
  .vbtn.on{background:var(--ink);color:var(--paper)}
  .dice{border:1px solid var(--terraline);border-radius:999px;background:var(--terrabg);color:var(--terra);font-size:.78rem;padding:.3rem .8rem;cursor:pointer;font-weight:600}
  .dice:active{transform:scale(.95)}
  .gcell.flash{animation:bbflash 2s ease}
  @keyframes bbflash{0%,60%{outline:3px solid var(--terra);outline-offset:2px;box-shadow:0 0 0 6px rgba(196,102,74,.25)}100%{outline:0 solid transparent;box-shadow:var(--shadow)}}
  .totop{position:fixed;bottom:1.1rem;right:1.1rem;z-index:50;border:1px solid var(--greenline);border-radius:999px;background:var(--green);color:#fff;font-size:1rem;padding:.5rem .7rem;cursor:pointer;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .15s}
  .totop.show{opacity:1;pointer-events:auto}
  .totop:hover{transform:translateY(-2px)}
  .totop:active{transform:scale(.93)}
  /* ---------- detail modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(40,32,20,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:26rem;border-radius:1.1rem 1.1rem 0 0;padding:1rem 1rem 1.3rem;box-shadow:0 -8px 30px rgba(0,0,0,.3);max-height:85vh;overflow:auto}
  .sheet .closeRow{display:flex;justify-content:flex-end;margin-bottom:.45rem;position:sticky;top:0;z-index:20}
  .sheet .grab{width:2.4rem;height:.3rem;border-radius:999px;background:var(--mut);opacity:.45;margin:-.45rem auto .55rem}
  .sheet .close{border:none;background:var(--ink);color:var(--paper);border-radius:999px;width:2rem;height:2rem;cursor:pointer;font-size:1rem;font-weight:700;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .sheet .dcover{height:13rem;border-radius:.5rem;display:flex;flex-direction:column;gap:.45rem;align-items:center;justify-content:center;color:#fff;font-size:3rem;font-weight:700;font-family:var(--font-head);text-shadow:0 1px 4px rgba(0,0,0,.4);position:relative;overflow:hidden;margin-bottom:.7rem;box-shadow:var(--shadow)}
  .sheet .dcover img{position:absolute;inset:.5rem;width:calc(100% - 1rem);height:calc(100% - 1rem);object-fit:contain;border-radius:.3rem}
  .sheet .dcover .ncmsg{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:0 1rem;text-align:center}
  .sheet .dcover .ncmsg span{font-size:.72rem;font-weight:600;opacity:.92}
  .sheet .dtitle{font-family:var(--font-head);font-size:1.15rem;font-weight:700;line-height:1.3}
  .sheet .dauthor{font-size:.85rem;color:var(--mut);font-style:italic;margin-top:.15rem}
  .sheet .dpills{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem}
  .sheet .downer{margin-top:.7rem;font-size:.85rem;color:var(--mut)}
  .sheet .downer b{color:var(--ink);font-weight:600}
  .sheet .dnote{margin-top:.5rem;font-size:.75rem;color:var(--mut);background:var(--paper);border:1px solid var(--line);border-radius:.5rem;padding:.5rem .6rem}
  .sheet .ddesc{margin-top:.6rem;font-size:.78rem;line-height:1.45;color:var(--ink)}
  .sheet .ddesc .more{display:none}
  .sheet .ddesc.open .more{display:inline}
  .sheet .ddesc.open .ell{display:none}
  .sheet .ddesc .toggle{color:var(--terra);cursor:pointer;font-weight:600;white-space:nowrap}
  .sheet .contact{display:block;text-align:center;text-decoration:none;margin-top:.9rem;border-radius:.65rem;padding:.7rem;font-weight:700;font-family:var(--font-head);border:none;cursor:pointer;width:100%;font-size:.95rem}
  .sheet .contact.offer{background:var(--green);color:#fff}
  .sheet .contact.wishc{background:var(--terra);color:#fff}
  .sheet .dfoot{margin-top:.5rem;text-align:center;font-size:.7rem;color:var(--mut)}
  .sheet .cmsg{width:100%;box-sizing:border-box;margin-top:.7rem;border:1px solid var(--line);border-radius:.65rem;padding:.7rem;font-size:1rem;font-family:inherit;background:var(--paper);color:var(--ink);resize:none}
  .sheet .durLbl{display:block;margin-top:.6rem;font-size:.75rem;color:var(--mut)}
  .sheet select.ctl{width:100%;margin:.3rem 0 .1rem}
  .sheet .contact.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:.5rem}
  /* ---------- list view ---------- */
  .book{display:flex;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .8rem;margin-bottom:.55rem;box-shadow:var(--shadow);border-left:4px solid var(--green);transition:transform .12s;cursor:pointer}
  .book:hover{transform:translateY(-1px)}
  .book.wish{border-left-color:var(--terra);background:var(--terrabg)}
  .book.lent{border-left-color:var(--mut);opacity:.65}
  .cover{flex:0 0 3.2rem;height:4.4rem;border-radius:.35rem .45rem .45rem .35rem;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.1rem;font-family:var(--font-head);text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:inset 3px 0 0 rgba(255,255,255,.25),inset -2px 0 0 rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.25);position:relative;overflow:hidden}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .bbody{flex:1;min-width:0}
  .bhead{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
  .btitle{font-weight:600;font-size:.92rem;font-family:var(--font-head)}
  .bauthor{font-size:.78rem;color:var(--mut);font-style:italic}
  .bmeta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.35rem}
  .pill{font-size:.66rem;border-radius:999px;padding:.1rem .5rem;background:var(--greenbg);color:var(--greendk);border:1px solid var(--greenline)}
  .pill.kiez{background:#eef2f8;color:#3d5a80;border-color:#cfdcea}
  .pill.age{background:#f7f0fa;color:#6b21a8;border-color:#e5d5f0}
  .pill.wish{background:var(--terrabg);color:var(--terra);border-color:var(--terraline)}
  .pill.lentp{background:var(--paper);color:var(--mut);border-color:var(--line)}
  /* ---------- grid view ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.8rem}
  .gcell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;box-shadow:var(--shadow)}
  .gcell:hover{box-shadow:0 6px 20px rgba(60,50,30,.18);transform:translateY(-3px)}
  .gcell.wish{background:var(--terrabg);border-color:var(--terraline)}
  .gcell.lent{opacity:.65}
  .gcover{height:9.5rem;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:2rem;font-family:var(--font-head);text-shadow:0 1px 3px rgba(0,0,0,.3);position:relative;overflow:hidden;box-shadow:inset 5px 0 0 rgba(255,255,255,.22),inset -3px 0 0 rgba(0,0,0,.14)}
  /* fallback senza foto: "rilegato classico" (luce di stoffa + cornice doppia, niente colore piatto) */
  .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(130% 130% at 30% 15%, rgba(255,255,255,.18), rgba(0,0,0,.28) 95%)}
  .fb::before{content:"";position:absolute;inset:.3rem;border:1px solid rgba(255,252,244,.55);border-radius:.2rem}
  .fb::after{content:"";position:absolute;inset:.45rem;border:1px solid rgba(255,252,244,.22);border-radius:.14rem}
  .gcell .fb::before{inset:.45rem}
  .gcell .fb::after{inset:.6rem}
  .gcell .fb .ft{font-family:var(--font-head);font-size:.72rem;font-weight:600;line-height:1.35;letter-spacing:.02em;text-align:center;max-width:86%;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  /* copertine senza immagine: prima pagina interna del libro, per fascia d'età */
  .gcell .fb.fb-adult,.gcell .fb.fb-teen,.gcell .fb.fb-kid{inset:.4rem;border:none;border-radius:.3rem;background:#fffcf4;box-shadow:inset 0 0 0 1px rgba(120,100,70,.15)}
  .gcell .fb.fb-adult::before{content:"";border:none;background:none;border-radius:0}
  .gcell .fb.fb-adult::after{content:"leri tavo smindi queno malto riveso fando piltr e smanco diveto larbo sumenti crovel opende travi lismo fenuto gardo beltri omavi sundi pelcro tarve monti rilu spado gende flimo varbo santro milve dospo crande luve tarbo smendi quilo prano velto";position:absolute;top:1.1rem;left:.6rem;right:.6rem;bottom:.55rem;border:none;border-radius:0;background:none;text-align:justify;font-size:.38rem;line-height:.5rem;color:rgba(64,52,40,.62);overflow:hidden}
  .gcell .fb.fb-teen::before{content:"";border:none;background:none;border-radius:0}
  .gcell .fb.fb-teen::after{content:"tavi lomendo sirbo\A quanelto mi dreve\A spo lantri comeda";position:absolute;top:1.3rem;left:.85rem;right:.85rem;bottom:auto;border:none;border-radius:0;background:none;white-space:pre-line;text-align:left;font-size:.5rem;line-height:.85rem;color:rgba(64,52,40,.68)}
  .gcell .fb.fb-kid{background:radial-gradient(var(--gold) 58%,rgba(0,0,0,0) 64%) 50% 1.05rem / 2.2rem 2.2rem no-repeat #fffcf4}
  .gcell .fb.fb-kid::before{content:"tili rombo savi\A mendo lupa tris";position:absolute;top:3.55rem;left:0;right:0;bottom:auto;border:none;border-radius:0;background:none;white-space:pre-line;text-align:center;font-size:.5rem;line-height:.7rem;color:rgba(64,52,40,.65)}
  .gcell .fb.fb-kid::after{content:"";position:absolute;bottom:0;left:0;right:0;top:auto;height:2.6rem;border:none;border-radius:100% 100% 0 0;background:radial-gradient(var(--terra) 55%,rgba(0,0,0,0) 60%) 20% 85% / .55rem .55rem no-repeat,radial-gradient(#d4959b 55%,rgba(0,0,0,0) 60%) 50% 90% / .45rem .45rem no-repeat,radial-gradient(var(--gold) 55%,rgba(0,0,0,0) 60%) 75% 82% / .5rem .5rem no-repeat,var(--green)}
  .sheet .dcover .fb{position:static;inset:auto;background:none}
  .sheet .dcover .fb::before,.sheet .dcover .fb::after{display:none}
  .book.wish .cover,.gcell.wish .gcover,.sheet .dcover.wish{background:var(--terrabg)!important;border:2px dashed var(--terra)}
  .book.wish .fb,.gcell.wish .fb{color:var(--terra);text-shadow:none}
  .sheet .dcover.wish{color:var(--terra);text-shadow:none}
  .sheet .dcover.wish .ncmsg span{font-family:system-ui,sans-serif;font-size:.95rem;font-weight:400;color:var(--mut)}
  .gcover .badge{position:absolute;top:.72rem;left:.72rem;font-size:.68rem;font-family:var(--font-head);font-weight:700;white-space:nowrap;max-width:calc(100% - 1.44rem);overflow:hidden;text-overflow:ellipsis;background:var(--card);border:1px solid var(--line);border-radius:.45rem;padding:.15rem .5rem;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:1.25;z-index:2}
  .gcover .badge.b-kid{background:var(--green);border-color:var(--green);color:#fff}
  .gcover .badge.b-teen{background:var(--gold);border-color:var(--gold);color:#fff}
  .gcover .badge.b-adult{background:var(--terra);border-color:var(--terra);color:#fff}
  .gcover .badge.b-wish{background:var(--card);border-color:var(--terra);color:var(--terra)}
  :root.dark .gcover .badge.b-kid{background:var(--greendk);border-color:var(--greendk);color:#211d17}

// ============ STATE ============
const store = (()=>{ try { return window.localStorage; } catch(e){ return {getItem:()=>null,setItem:()=>{}}; } })();
// Lingua UI: se l'utente ha scelto una lingua manualmente → quella (salvata in locale);
// altrimenti auto-rilevata dal browser (it/de), fallback inglese. Tema: chiaro standard per tutti.
const autoLang = (()=>{ try { const l=(navigator.language||"en").slice(0,2).toLowerCase(); return l==="it"?"it":l==="de"?"de":"en"; } catch(e){ return "en"; } })();
const S = {lang:store.getItem("bb-lang")||autoLang, blang:store.getItem("bb-blang")||"", kiez:store.getItem("bb-kiez")||"", age:"all", subAge:"", type:"all", genre:"", q:"", view:"grid", sort:store.getItem("bb-sort")||"new", theme:store.getItem("bb-theme")||"light"}; // kiez e lingua libri: ricordati alla visita successiva (localStorage)
const $ = id => document.getElementById(id);
// Anti HTML-injection: i campi da form (titolo/autore/desc/note) sono testo NON fidato — sempre escappati al rendering
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const plain = s => String(s).replace(/^[^a-zA-Z0-9à-ÿÀ-ÿ]+/u,"").trim(); // toglie l'emoji iniziale: chip età compatte senza emoji (emoji restano in badge/pillole/sottofasce)
const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : {matches:false,addEventListener:()=>{}};

function applyTheme(){
  const dark = S.theme==="dark" || (S.theme==="auto" && mq.matches);
  document.documentElement.classList.toggle("dark",dark);
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
  $("themeBtn").title = S.theme==="auto" ? "auto" : S.theme;
}
$("themeBtn").addEventListener("click",()=>{
  S.theme = S.theme==="light" ? "dark" : S.theme==="dark" ? "light" : "light";
  try { store.setItem("bb-theme",S.theme); } catch(e){}
  applyTheme();
});
try { mq.addEventListener("change",applyTheme); } catch(e){}
applyTheme();

// ============ RENDER ============
function filtered(){
  const q=S.q.toLowerCase();
  return BOOKS.filter(b=>
    (!S.blang||b.lang===S.blang) &&
    (!S.kiez||b.kiez===S.kiez) &&
    (S.age==="all" || (S.age==="kids" ? ["0-3","3-6","6-9","9-12"].includes(b.age) :
      S.age==="teen" ? b.age==="12+" : b.age==="adults")) &&
    (!S.subAge || b.age===S.subAge) &&
    (S.type==="all"||b.type===S.type) &&
    (!S.genre||b.genre===S.genre) &&
    (!q || (b.title+" "+b.author+" "+b.lang).toLowerCase().includes(q))
  );
}

function coverImg(b,size){
  const src=b.coverUrl||(b.isbn?`https://covers.openlibrary.org/b/isbn/${b.isbn}-${size}.jpg?default=false`:"");
  return src?`<img src="${src}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" onload="var fb=this.parentNode.querySelector('.fb');if(fb)fb.style.display='none'" onerror="this.remove()">`:"";
}
function cardRow(b){
  const t=T[S.lang];
  const pills = [
    `<span class="pill">${b.lang}</span>`,
    `<span class="pill kiez">${b.kiez}</span>`,
    b.age==="12+" ? `<span class="pill age">${t.teen}</span>` :
    b.age==="adults" ? `<span class="pill age">${t.adults}</span>` :
    `<span class="pill age">${t.subAges[b.age]||b.age}</span>`,
    b.type==="wish" ? `<span class="pill wish">✨ ${b.kind==="similar"?t.kindSimilar:b.kind==="theme"?t.kindTheme:t.wishLabel}</span>` : "",
    b.status==="lent" ? `<span class="pill lentp">⏳ ${t.lent}${b.note?" · "+esc(b.note):""}</span>` : ""
  ].join("");
  return `<div class="book ${b.type==="wish"?"wish":""} ${b.status==="lent"?"lent":""}" data-idx="${BOOKS.indexOf(b)}" onclick="openSheet(BOOKS[${BOOKS.indexOf(b)}])">
    <div class="cover" style="background:${b.cover}">${coverImg(b,"M")}<span class="fb">${b.type==="wish"?"✨":b.title.charAt(0)}</span></div>
    <div class="bbody">
      <div class="bhead"><span class="btitle">${esc(b.title)}</span><span class="bauthor">${b.author!=="—"?esc(b.author):""}</span></div>
      <div class="bmeta">${pills}</div>
    </div>
  </div>`;
}

function fbTit(s){const w=String(s).split(" ");let out=[];for(const x of w){if(out.length>=3||((out.join(" ")+" "+x).trim().length>18))break;out.push(x);}if(!out.length)out=[String(s).slice(0,12)];return out.join(" ")+"\u2026";}
function gridCells(list){
  const t=T[S.lang];
  return `<div class="grid">` + list.map(b=>{
    const badge = b.type==="wish" ? `✨ ${t.wishLabel}` :
      b.age==="12+" ? t.teen : (b.age==="adults" ? t.adults : t.subAges[b.age]||"");
    const badgeCls = b.type==="wish" ? "b-wish" : (b.age==="adults" ? "b-adult" : (b.age==="12+" ? "b-teen" : "b-kid"));
    const lentb = b.status==="lent" ? `⏳ ${t.lent}` : "";
    const cov = coverImg(b,"M");
    return `<div class="gcell ${b.type==="wish"?"wish":""} ${b.status==="lent"?"lent":""}" data-idx="${BOOKS.indexOf(b)}" onclick="openSheet(BOOKS[${BOOKS.indexOf(b)}])">
      <div class="gcover" style="background:${b.cover}">
        ${cov}
        ${badge?`<span class="badge ${badgeCls}">${badge}</span>`:""}
        <span class="fb ${b.type==="wish"?"":`fb-${b.age==="adults"?"adult":(b.age==="12+"?"teen":"kid")}`}">${b.type==="wish"?"\u2728":""}</span>
        ${lentb?`<span class="lentb">${lentb}</span>`:""}
      </div>
      <div class="ginfo">
        <div class="gtitle${b.type==="wish"?" wphrase":""}" title="${esc(b.title+(b.author&&b.author!=="—"?" — "+b.author:""))}">${esc(b.title)}</div>
        ${b.type==="wish"?`<div class="wkind">${t.wishK[b.kind]||t.kindTitle}</div>`:""}
        <div class="gmeta">
          <div class="row1"><span class="l">${b.lang}</span><span class="k">${b.kiez}</span></div>
        </div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

// ============ DETAIL SHEET ============
let CURB=null; // libro corrente del dialog contatto (dichiarata: "use strict" impedisce le variabili implicite)
function openSheet(b){
  const t=T[S.lang];
  const pills = [
    `<span class="pill">${b.lang}</span>`,
    `<span class="pill kiez">📍 ${b.kiez}</span>`,
    b.age==="12+" ? `<span class="pill age">${t.teen}</span>` :
    b.age==="adults" ? `<span class="pill age">${t.adults}</span>` :
    `<span class="pill age">${t.subAges[b.age]||b.age}</span>`,
    b.genre ? `<span class="pill">${t.genres[b.genre]}</span>` : "",
    b.type==="wish" ? `<span class="pill wish">✨ ${b.kind==="similar"?t.kindSimilar:b.kind==="theme"?t.kindTheme:t.wishLabel}</span>` : "",
    b.status==="lent" ? `<span class="pill lentp">⏳ ${t.lent}${b.note?" · "+b.note:""}</span>` : ""
  ].join("");
  const owner = b.type==="wish" ? t.wishOwner : t.owner;
  $("sheet").innerHTML =
    `<div class="grab"></div><div class="closeRow"><button class="close" id="sheetClose">✕</button></div>`+
    `<div class="dcover ${b.type==="wish"?"wish":""}" style="background:${b.cover}">${coverImg(b,"L")}<div class="ncmsg fb"><b>${b.type==="wish"?"✨":b.title.charAt(0)}</b><span>${b.type==="wish"?t.wishCover:t.noCover}</span></div></div>`+
    `<div class="dtitle">${esc(b.title)}</div>`+
    (b.author!=="—"&&b.author?`<div class="dauthor">${esc(b.author)}</div>`:"")+
    `<div class="dpills">${pills}</div>`+
    `<div class="downer">${owner}</div>`+
    (b.desc?`<div class="ddesc" id="ddesc">${b.desc.length>220
      ? `${esc(b.desc.slice(0,220))}<span class="ell">…</span> <span class="toggle" onclick="document.getElementById('ddesc').classList.add('open');this.style.display='none'">${t.more}</span><span class="more">${esc(b.desc.slice(220))}</span>`
      : esc(b.desc)}</div>`:"")+
    (b.type!=="wish"?(b.status==="lent"?`<div class="dnote">${t.stateLent} <b>${esc(b.note||"—")}</b></div>`:`<div class="dnote">${t.stateAvail}</div>`):"")+
    `<button class="contact ${b.type==="wish"?"wishc":"offer"}" onclick="contactSheet(BOOKS[${BOOKS.indexOf(b)}])">${b.type==="wish"?t.askWish:t.askOffer}</button>`+
    `<div class="dfoot">${t.contactNote}</div>`;
  $("overlay").style.display="flex";
  $("sheetClose").addEventListener("click",closeSheet);
}
function closeSheet(){ $("overlay").style.display="none"; }
function contactSheet(b){
  const t=T[S.lang];
  CURB=b;
  const msg=(b.type==="wish"?t.cMsgWish(esc(b.title),b.kiez):t.cMsgOffer(esc(b.title),esc(b.author||"—"),b.kiez))+"\n"+(b.type==="wish"?t.dNoneW:t.dNone);
  $("sheet").innerHTML=
    `<div class="grab"></div><div class="closeRow"><button class="close" id="sheetClose">✕</button></div>`+
    `<div class="dtitle">${t.cTitle}</div>`+
    `<div class="downer">${t.cIntro}</div>`+
    `<textarea class="cmsg" id="cmsg" rows="4" readonly>${msg}</textarea>`+
    `<label class="durLbl" for="durSel">${b.type==="wish"?t.dLabelW:t.dLabel}</label>`+
    `<select id="durSel" class="ctl" onchange="updMsg()"><option value="">${t.dDef}</option>${t.dOpts.map((o,i)=>`<option value="${i}">${o}</option>`).join("")}</select>`+
    (SITE_CONTACT?`<a class="contact offer" id="mailBtn" href="mailto:${SITE_CONTACT}?subject=${encodeURIComponent(t.cSubj(b.title,b))}&body=${encodeURIComponent(msg)}">${t.cSendNow}</a>`:"")+
    `<button class="contact ${SITE_CONTACT?"ghost":"offer"}" id="copyBtn" onclick="copyMsg()">${t.cCopy}</button>`+
    `<button class="contact ghost" onclick="openSheet(BOOKS[${BOOKS.indexOf(b)}])">← ${t.cBack}</button>`+
    `<div class="dfoot">${SITE_CONTACT?t.cSend(SITE_CONTACT):t.cSendSoon} ${t.cPriv}</div>`;
  $("overlay").style.display="flex";
  $("sheetClose").addEventListener("click",closeSheet);
}
function updMsg(){
  const t=T[S.lang],b=CURB,sel=$("durSel");
  if(!b)return;
  let msg=b.type==="wish"?t.cMsgWish(esc(b.title),b.kiez):t.cMsgOffer(esc(b.title),esc(b.author||"—"),b.kiez);
  if(sel&&sel.value!=="") msg+="\n"+(b.type==="wish"?t.dLineW(t.dOpts[sel.value]):t.dLine(t.dOpts[sel.value]));
  else msg+="\n"+(b.type==="wish"?t.dNoneW:t.dNone);
  msg+="\n\n"+t.mailFoot;
  $("cmsg").value=msg;
  const mb=$("mailBtn");
  if(mb&&SITE_CONTACT) mb.href=`mailto:${SITE_CONTACT}?subject=${encodeURIComponent(t.cSubj(b.title,b))}&body=${encodeURIComponent(msg)}`;
}
function copyMsg(){
  const ta=$("cmsg"),btn=$("copyBtn");
  ta.focus();ta.select();ta.setSelectionRange&&ta.setSelectionRange(0,ta.value.length);
  const done=()=>{ btn.textContent=T[S.lang].cCopied; };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done,()=>{ try{document.execCommand("copy");}catch(e){} done(); });
  }else{ try{document.execCommand("copy");}catch(e){} done(); }
}
$("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeSheet(); });
(function(){
  var sh=$("sheet"),sy=0,dy=0,drag=false;
  sh.addEventListener("touchstart",function(e){ if(e.touches.length!==1)return; sy=e.touches[0].clientY; dy=0; drag=true; sh.style.transition="none"; },{passive:true});
  sh.addEventListener("touchmove",function(e){
    if(!drag)return;
    dy=e.touches[0].clientY-sy;
    if(dy>0&&sh.scrollTop<=0){ sh.style.transform="translateY("+Math.min(dy,240)+"px)"; e.preventDefault(); }
    else if(dy<=0){ sh.style.transform=""; }
  },{passive:false});
  sh.addEventListener("touchend",function(){
    if(!drag)return; drag=false;
    sh.style.transition="transform .18s ease-out";
    if(dy>90&&sh.scrollTop<=0){ sh.style.transform="translateY(110%)"; setTimeout(closeSheet,160); }
    else{ sh.style.transform=""; }
    setTimeout(function(){ sh.style.transition=""; sh.style.transform=""; },200);
  });
})();

function sortedList(list){ return [...list].sort((a,b)=>{ if(S.sort==="new") return String(b.added||"").localeCompare(String(a.added||"")); return String(a.added||"").localeCompare(String(b.added||"")); }); }
function renderAll(){
  const t=T[S.lang], list=sortedList(filtered());
  $("list").innerHTML = list.length ? list.map(cardRow).join("") : `<p class="empty">${t.empty}</p>`;
  $("table").innerHTML = list.length ? gridCells(list) : `<p class="empty">${t.empty}</p>`;
  $("count").textContent = t.count(list.length);
  $("list").style.display = S.view==="list"?"":"none";
  $("table").style.display = S.view!=="list"?"":"none";
  $("vList").classList.toggle("on",S.view==="list");
  $("vTable").classList.toggle("on",S.view!=="list");
}

function applyLang(){
  const t=T[S.lang];
  document.documentElement.lang=S.lang;
  $("langSel").value=S.lang; // riflette lingua auto-rilevata o salvata
  $("tagline").textContent=t.tagline;
  $("howTitle").textContent=t.howTitle;
  $("howList").innerHTML=t.how.map(s=>`<li>${s}</li>`).join("");
  $("howNote").textContent=t.howNote;
  $("lblOffer").textContent=t.lblOffer; $("subOffer").textContent=t.subOffer;
  $("lblWish").textContent=t.lblWish; $("subWish").textContent=t.subWish;
  if(S.kiez && !BOOKS.some(b=>b.kiez===S.kiez)) S.kiez=""; // kiez salvato ma sparito dal catalogo → reset, mai filtro fantasma
  if(S.blang && !BOOKS.some(b=>b.lang===S.blang)) S.blang="";
  $("kiezSel").innerHTML=`<option value="">${t.allKiez}</option>`+KIEZE.filter(k=>BOOKS.some(b=>b.kiez===k)).map(k=>`<option ${k===S.kiez?"selected":""}>${k}</option>`).join(""); // dropdown DINAMICO: solo i Kiez con libri in catalogo (come lingue e generi)
  $("langBookSel").innerHTML=`<option value="">${t.allLang}</option>`+BOOKLANGS.map(l=>`<option ${l===S.blang?"selected":""}>${l}</option>`).join("");
  // dropdown DINAMICO: solo i generi presenti nel catalogo (ordine canonico di GENRES) — i filtri vuoti non si offrono; il gestore assegna SEMPRE uno dei GENRES fissi
  $("genreSel").innerHTML=`<option value="">${t.allGenre}</option>`+GENRES.filter(g=>BOOKS.some(b=>b.genre===g)).map(g=>`<option value="${g}" ${g===S.genre?"selected":""}>${t.genres[g]}</option>`).join("");
  $("sortBtn").textContent="\u2195 "+(S.sort==="old"?t.sortOld:t.sortNew);
  $("sortBtn").title=t.sortBy;
  $("sortPop").innerHTML=`<button class="${S.sort==="new"?"on":""}" data-s="new">${t.sortFullNew}</button><button class="${S.sort==="old"?"on":""}" data-s="old">${t.sortFullOld}</button>`;
  $("typeRow").innerHTML=
    `<button class="chip ${S.type==="all"?"on":""}" data-v="all">${t.allType}</button>`+
    `<button class="chip offer ${S.type==="offer"?"on":""}" data-v="offer">${t.offers}</button>`+
    `<button class="chip wish ${S.type==="wish"?"on":""}" data-v="wish">${t.wishes}</button>`;
  $("ageRow").innerHTML=
    `<button class="chip ${S.age==="all"?"on":""}" data-v="all">${plain(t.allAges)}</button>`+
    `<button class="chip ${S.age==="adults"?"on":""}" data-v="adults">${plain(t.adults)}</button>`+
    `<button class="chip teen ${S.age==="teen"?"on":""}" data-v="teen">${plain(t.teen)}</button>`+
    `<span class="kidwrap"><button class="chip kids ${S.age==="kids"?"on":""}" data-v="kids">${plain(t.kids)}</button>`+
    (S.age==="kids"?`<span class="agechips sub show">`+Object.keys(t.subAges).map(a=>`<button class="chip kids ${S.subAge===a?"on":""}" data-v="${a}">${plain(t.subAges[a])}</button>`).join("")+`</span>`:"")+`</span>`; // fasce alla destra di Bambini, SENZA emoji (plain): il pacchetto entra su una riga anche su schermi stretti
  $("q").placeholder=t.search;
  $("vList").textContent=t.vList; $("vTable").textContent=t.vTable;
  $("dice").textContent="🎲"; $("dice").title=t.dice;
  $("footTxt").innerHTML=t.foot.map((s,i)=>`<p class="${i===1?"fproto":""}">${s}</p>`).join("");
  renderAll();
}

$("dice").addEventListener("click",()=>{
  const list=filtered(); if(!list.length)return;
  const b=list[Math.floor(Math.random()*list.length)];
  const idx=BOOKS.indexOf(b);
  const all=document.querySelectorAll(`[data-idx="${idx}"]`);
  const el=[...all].find(el=>el.offsetParent!==null) || all[0];
  if(!el)return;
  el.classList.remove("flash");
  void el.offsetWidth; // riavvia l'animazione
  el.classList.add("flash");
  try { el.scrollIntoView({block:"center"}); } catch(e){}
  try {
    const y=el.getBoundingClientRect().top + window.scrollY - (window.innerHeight/2) + (el.offsetHeight/2);
    if (Math.abs(window.scrollY-y)>4) window.scrollTo(0,Math.max(0,y));
  } catch(e){}
});

function toggleSortPop(){
  const p=$("sortPop"),b=$("sortBtn");
  if(p.style.display==="block"){ p.style.display="none"; return; }
  const r=b.getBoundingClientRect();
  p.style.position="fixed";
  p.style.top=Math.min(r.bottom+6,window.innerHeight-220)+"px";
  p.style.right=Math.max(8,window.innerWidth-r.right)+"px";
  p.style.zIndex="9999";
  p.style.display="block";
}
$("sortBtn").addEventListener("click",e=>{ e.stopPropagation(); toggleSortPop(); });
$("sortPop").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; setSort(b.dataset.s); $("sortPop").style.display="none"; });

});

  applyLang();
});
